name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build-web:
    name: Test and build web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Model tests (neural transcription on synthesised audio)
        run: npm run test:model
      - name: Build
        run: npm run build
      - name: Browser end-to-end tests
        run: |
          npx playwright-core install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: tests/e2e/out/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: dist

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # The default also requests the legacy `tools` package, which no longer exists.
          # Gradle downloads the SDK platform/build-tools it needs (licenses are accepted here).
          packages: platform-tools
      - run: npm ci
      - name: Build web assets and sync native project
        run: npm run android:sync
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tab-transcribe-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
